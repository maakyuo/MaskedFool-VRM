name: Build Blender 3D preview
on:
  push:
    paths:
      - 'build_avatar.py'
      - '.github/workflows/build-model.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Verify Blender Python NumPy
        run: |
          blender -b --python-expr "import numpy; print('NumPy:', numpy.__version__)"
      - name: Generate model
        run: |
          mkdir -p output
          blender -b -t 2 --python build_avatar.py
          test -s masked_fool_v2.glb
          test -s masked_fool_v2.blend
          mv masked_fool_v2.glb masked_fool_v2.blend output/
      - uses: actions/upload-artifact@v4
        with:
          name: masked-fool-blender-preview
          path: output/
          if-no-files-found: error
